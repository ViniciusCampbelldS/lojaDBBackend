<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro de produtos</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
    >

    <style>
        body {
            background: #f3f4f6;
        }

        main {
            max-width: 900px;
            margin: 40px auto;
            padding: 28px;
            background: white;
            border-radius: 12px;
        }

        .tabela-produtos-wrapper {
            max-height: 420px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
<main>
    <div class="d-flex justify-content-between align-items-center gap-3 mb-4 flex-wrap">
        <h1 class="h3 mb-0">Produtos da loja</h1>
        <button id="botaoAtualizar" class="btn btn-outline-secondary" type="button">
            Atualizar lista
        </button>
    </div>

    <form id="formProduto" class="mb-5">
        <h2 class="h5 mb-3">Cadastrar produto</h2>

        <div class="mb-3">
            <label for="nome" class="form-label">Nome</label>
            <input
                    id="nome"
                    class="form-control"
                    type="text"
                    maxlength="100"
                    required
            >
        </div>

        <div class="mb-3">
            <label for="preco" class="form-label">Preço</label>
            <input
                    id="preco"
                    class="form-control"
                    type="number"
                    min="0.01"
                    max="9999999999.99"
                    step="0.01"
                    required
            >
        </div>

        <button id="botaoSalvar" class="btn btn-primary" type="submit">
            Salvar
        </button>
    </form>

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h2 class="h5 mb-0">Produtos cadastrados</h2>
        <span id="quantidadeProdutos" class="badge text-bg-secondary">0 produtos</span>
    </div>

    <div id="estadoLista" class="alert alert-secondary" role="status">
        Carregando produtos...
    </div>

    <div class="table-responsive tabela-produtos-wrapper">
        <table class="table table-striped table-hover align-middle mb-0">
            <thead class="table-dark">
            <tr>
                <th scope="col">Nome</th>
                <th scope="col" class="text-end">Preço</th>
            </tr>
            </thead>
            <tbody id="listaProdutos"></tbody>
        </table>
    </div>

    <p id="mensagem" class="mt-3 mb-0" role="status"></p>
</main>

<script>
    const formulario = document.getElementById("formProduto");
    const mensagem = document.getElementById("mensagem");
    const botaoSalvar = document.getElementById("botaoSalvar");
    const botaoAtualizar = document.getElementById("botaoAtualizar");
    const listaProdutos = document.getElementById("listaProdutos");
    const estadoLista = document.getElementById("estadoLista");
    const quantidadeProdutos = document.getElementById("quantidadeProdutos");

    function formatarPreco(preco) {
        return new Intl.NumberFormat("pt-BR", {
            style: "currency",
            currency: "BRL"
        }).format(Number(preco));
    }

    function atualizarQuantidade(total) {
        quantidadeProdutos.textContent = `${total} ${total === 1 ? "produto" : "produtos"}`;
    }

    function exibirEstadoLista(tipo, texto) {
        estadoLista.className = `alert alert-${tipo}`;
        estadoLista.textContent = texto;
        estadoLista.hidden = false;
    }

    function esconderEstadoLista() {
        estadoLista.hidden = true;
    }

    function renderizarProdutos(produtos) {
        listaProdutos.innerHTML = "";
        atualizarQuantidade(produtos.length);

        if (produtos.length === 0) {
            exibirEstadoLista("info", "Nenhum produto cadastrado.");
            return;
        }

        esconderEstadoLista();

        const fragmento = document.createDocumentFragment();

        produtos.forEach((produto) => {
            const linha = document.createElement("tr");
            const colunaNome = document.createElement("td");
            const colunaPreco = document.createElement("td");

            colunaNome.textContent = produto.nome ?? "";
            colunaPreco.textContent = formatarPreco(produto.preco);
            colunaPreco.classList.add("text-end");

            linha.append(colunaNome, colunaPreco);
            fragmento.appendChild(linha);
        });

        listaProdutos.appendChild(fragmento);
    }

    async function carregarProdutos() {
        botaoAtualizar.disabled = true;
        exibirEstadoLista("secondary", "Carregando produtos...");

        try {
            const resposta = await fetch("/api/produtos", {
                headers: {
                    "Accept": "application/json"
                }
            });

            if (!resposta.ok) {
                throw new Error("Não foi possível carregar os produtos.");
            }

            const produtos = await resposta.json();
            renderizarProdutos(produtos);
        } catch (erro) {
            listaProdutos.innerHTML = "";
            atualizarQuantidade(0);
            exibirEstadoLista("danger", erro.message);
        } finally {
            botaoAtualizar.disabled = false;
        }
    }

    formulario.addEventListener("submit", async (evento) => {
        evento.preventDefault();

        const produto = {
            nome: document.getElementById("nome").value.trim(),
            preco: document.getElementById("preco").value
        };

        botaoSalvar.disabled = true;
        mensagem.className = "mt-3 mb-0 text-secondary";
        mensagem.textContent = "Salvando...";

        try {
            const resposta = await fetch("/api/produtos", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(produto)
            });

            const textoResposta = await resposta.text();

            if (!resposta.ok) {
                throw new Error(textoResposta || "Não foi possível cadastrar. Confira os dados.");
            }

            mensagem.className = "mt-3 mb-0 text-success";
            mensagem.textContent = textoResposta;
            formulario.reset();
            await carregarProdutos();
        } catch (erro) {
            mensagem.className = "mt-3 mb-0 text-danger";
            mensagem.textContent = erro.message;
        } finally {
            botaoSalvar.disabled = false;
        }
    });

    botaoAtualizar.addEventListener("click", carregarProdutos);

    carregarProdutos();
</script>
</body>
</html>
